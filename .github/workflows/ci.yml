name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # api-diff needs the release tags to find the previous root version.
          fetch-depth: 0

      # mise.toml is the single source of truth for the Go toolchain and the
      # formatter/linter versions. Do not reintroduce inline gofumpt or
      # golangci-lint pins here; they drift from the local gate.
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: true
          cache: true

      # check = fmt-check + lint + build + test-all + generate-check + vuln
      # + api-diff. api-diff reports incompatible pre-1.0 changes without
      # failing; set API_DIFF_STRICT=1 here after 1.0.
      - name: check
        run: mise run check
